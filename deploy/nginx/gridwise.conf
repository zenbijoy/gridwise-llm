# Nginx reverse proxy configuration for GridWise LLM
# Replace YOUR_DOMAIN with your actual domain or subdomain (e.g. gridwise.example.com)

upstream gridwise_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name gridwise.duckdns.org;

    # Maximum payload size limit
    client_max_body_size 1M;

    # Basic timeout settings
    client_body_timeout 10s;
    client_header_timeout 10s;

    location / {
        proxy_pass http://gridwise_backend;
        proxy_http_version 1.1;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Timeouts aligned with solver and LLM execution limits
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
